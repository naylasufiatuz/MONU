name: monu
description: "DiHutan - Monitoring Hutan (proyek kelas IoT MONU)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Tampilan dan tema
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8

  # State management (pengelola data antar halaman)
  provider: ^6.1.5

  # Grafik dan peta
  fl_chart: ^1.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.9.1

  # Firebase (dipasang sekarang, baru dipakai di Bagian 6)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_database: ^13.0.1

  # Supabase (Database Postgres, Auth, Realtime)
  supabase_flutter: ^2.8.0

  # Notifikasi di HP
  flutter_local_notifications: ^23.0.0

  # Penyimpanan pengaturan di perangkat
  shared_preferences: ^2.5.3

    # Tes koneksi dan pembacaan Firebase (REST)
  http: ^1.6.0
  
  # Format tanggal/angka (versinya diatur otomatis oleh Flutter)
  intl: any

  # Ekspor laporan PDF
  pdf: ^3.13.0
  printing: ^5.14.2

  # Perbaikan: image butuh archive yang lebih baru
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/